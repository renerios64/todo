name: Deploy to Test

on:
  push:
    branches:
      - test

permissions:
  id-token: write
  contents: read

env:
  ACR: acrtodotesta8ca4a.azurecr.io
  API_APP: ca-api-todo-test
  WEB_APP: ca-web-todo-test
  RESOURCE_GROUP: rg-todo-test-eastus2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TEST_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        run: |
          az acr build \
            --registry acrtodotesta8ca4a \
            --image todo-api:${{ steps.tag.outputs.tag }} \
            --image todo-api:latest \
            --platform linux/amd64 \
            --file src/api/Dockerfile \
            src/api

      - name: Build and push web image
        run: |
          az acr build \
            --registry acrtodotesta8ca4a \
            --image todo-web:${{ steps.tag.outputs.tag }} \
            --image todo-web:latest \
            --platform linux/amd64 \
            --file src/web/Dockerfile \
            src/web

      - name: Update API container app
        run: |
          az containerapp update \
            --name ${{ env.API_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR }}/todo-api:${{ steps.tag.outputs.tag }}

      - name: Update web container app
        run: |
          az containerapp update \
            --name ${{ env.WEB_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR }}/todo-web:${{ steps.tag.outputs.tag }}
