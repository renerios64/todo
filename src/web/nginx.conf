server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Pass API requests to the .NET API container.
    # In Compose, "api" resolves to the API container on the shared network.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # For any route that doesn't match a real file, serve index.html.
    # This is what makes React Router work — the browser gets index.html,
    # React boots up, reads the URL, and renders the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
